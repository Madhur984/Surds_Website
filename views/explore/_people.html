<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>people check</title>
<style>html,body{margin:0;background:#20242a;overflow:hidden;} canvas{display:block;}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
<!-- Dev tool (not linked): every posed figure, dressed, in a row; ?f=people_raw picks the file. -->
<canvas id="c"></canvas>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { loadPeople, makePerson } from "/views/explore/people.js";
const q = new URLSearchParams(location.search), file = q.get("f") || "people";
const r = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, preserveDrawingBuffer: true });
r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xd9dcdf);
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.6;
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(3, 6, 5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 4, bottom: -2 }); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0xc9ccd0, roughness: 0.8 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const l = new GLTFLoader(); l.setMeshoptDecoder(MeshoptDecoder);
await loadPeople(l, `/views/explore/assets/${file}.glb?t=${Date.now()}`);
const yaw = +(q.get("yaw") || 0.35);
let i = 0;
for (const body of ["m", "f"]) for (const pose of ["stand", "walk", "tablet", "sit", "kneel"]) {
  const p = makePerson({ body, pose, seed: i + 3, vest: i % 4 === 1, hat: i % 4 === 1 });
  p.position.set(-4.05 + i * 0.9, 0, 0); p.rotation.y = yaw; scene.add(p); i++;
}
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 100);
const z = +(q.get("z") || 9.5), x = +(q.get("x") || 0); cam.position.set(x, +(q.get("cy") || 1.3), z); cam.lookAt(x, +(q.get("ly") || 0.8), 0);
r.render(scene, cam); document.title = "done";
</script>
</body>
</html>
